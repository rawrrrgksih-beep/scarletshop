# ============================================================
#  CookieShop - shop.yml
#
#  Tiap kategori:
#    name       : nama ikon di menu utama
#    icon       : material ikon di menu utama
#    menu-slot  : posisi ikon di menu utama (0-53)
#    title      : judul GUI kategori
#    currency   : money (Vault) atau shards
#    rows       : (opsional) jumlah baris, otomatis kalau dikosongkan
#
#  Tiap item (nama key = nama material, kecuali pakai "material:"):
#    buy / sell : harga per bundle. Hapus kalau tidak bisa dibeli / dijual
#    amount     : isi 1 bundle (default 1)
#    name/lore  : tampilan custom (opsional)
#    slot       : posisi manual (opsional, default auto-layout)
#    commands   : jalankan command console saat dibeli (%player%)
#
#  Kontrol di GUI:
#    Klik kiri = beli | Shift+kiri = beli 1 stack
#    Klik kanan = jual | Shift+kanan = jual semua
#
#  Harga di bawah hanya contoh, silakan sesuaikan.
# ============================================================

