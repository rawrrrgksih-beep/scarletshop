prefix: "&6&lSHOP &8▷ "

main-menu:
  title: "&8Shop"
  rows: 6

back-button:
  material: RED_STAINED_GLASS_PANE
  name: "&cBack"

# Format harga. %s = angka (otomatis jadi K / M / B)
currency:
  money: "$%s"
  shards: "%s Shards"

# Baris lore yang ditambahkan ke item di GUI
lore:
  open: "&eKlik untuk membuka"
  buy: "&7Klik kiri: &aBeli x%amount% &8(&a%price%&8)"
  buy-stack: "&7Shift + klik kiri: &aBeli x%amount% &8(&a%price%&8)"
  sell: "&7Klik kanan: &cJual x%amount% &8(&c%price%&8)"
  sell-all: "&7Shift + klik kanan: &cJual semua"
  buy-command: "&7Klik kiri: &aBeli &8(&a%price%&8)"

messages:
