  reloaded: "&aShop berhasil di-reload."
  economy-missing: "&cEconomy belum tersedia, hubungi admin."
  not-for-sale: "&cItem ini tidak bisa dibeli."
  not-sellable: "&cItem ini tidak bisa dijual."
  not-enough: "&cUang tidak cukup. Butuh &f%price%&c, kamu punya &f%balance%&c."
